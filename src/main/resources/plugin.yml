name: LifeSimulator
version: 1.0.0
main: com.enderdevelopment.plugin.Main
author: EnderDevelopment
description: A Minecraft Bedrock Life Simulator inspired by The Sims
api-version: "1.21"
commands:
  sim:
    description: Main command for the Life Simulator plugin.
    usage: /sim <subcommand>
    subcommands:
      spawn:
        description: Spawn a human NPC.
        usage: /sim spawn <role>
      interact:
        description: Open the social interaction menu.
        usage: /sim interact
      craft:
        description: Craft a Burglar Alarm.
        usage: /sim craft alarm